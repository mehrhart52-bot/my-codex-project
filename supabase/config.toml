# Optional isolated test stack. The normal hosted development path needs only Node.
project_id = "hta-fictional-development"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = false

# Isolated fictional test accounts only; these are not hosted-project settings.
[auth.rate_limit]
sign_in_sign_ups = 1000
token_refresh = 1000
email_sent = 1000
